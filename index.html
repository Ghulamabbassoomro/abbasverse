.brand-name{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:rgba(232,226,216,0.88);margin-bottom:.3rem;line-height:1;}
.brand-role{font-size:7px;font-weight:400;letter-spacing:.35em;color:rgba(210,175,80,0.45);text-transform:uppercase;margin-bottom:1rem;}
.brand-desc{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;font-weight:300;line-height:1.8;color:rgba(232,226,216,0.82);}
.brand-reels{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:1.2rem;}
.brand-reel{aspect-ratio:9/16;overflow:hidden;background:rgba(232,226,216,0.03);border:1px solid rgba(232,226,216,0.06);}
.brand-reel video{width:100%;height:100%;object-fit:cover;display:block;}
.brand-reel-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:7px;letter-spacing:.3em;color:rgba(232,226,216,0.15);text-transform:uppercase;text-align:center;padding:.5rem;}
.brand-insta{margin-top:1.2rem;background:rgba(232,226,216,0.02);border:1px solid rgba(232,226,216,0.07);overflow:hidden;}
.brand-insta img{width:100%;display:block;}
.brand-insta-ph{padding:1.5rem;font-size:7px;letter-spacing:.3em;color:rgba(232,226,216,0.15);text-transform:uppercase;text-align:center;}

/* ── CINEMATOGRAPHER ── */
#cine{background:linear-gradient(to bottom,#0e0c0a,#0c0f13 40%,#0c0f13 60%,#0e0c0a);padding:5rem 2.5rem;}
.cine-desc{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.2rem;font-weight:300;line-height:1.85;color:rgba(232,226,216,0.82);max-width:520px;margin-top:1.2rem;}
.cine-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:2.5rem;}
@media(max-width:700px){.cine-grid{grid-template-columns:1fr;}}
.cine-cell{aspect-ratio:16/9;overflow:hidden;border:1px solid rgba(90,130,175,0.08);}
.cine-cell iframe{width:100%;height:100%;border:none;display:block;}
.cine-wide{grid-column:span 2;}
@media(max-width:700px){.cine-wide{grid-column:span 1;}}

/* ── MEDIA ARTIST ── */
#mediaartist{background:linear-gradient(to bottom,#0e0c0a,#080d10 30%,#080d10 70%,#0e0c0a);padding:5rem 2.5rem;}

/* Project card */
.ma-project{margin-top:3.5rem;padding:2.5rem;border:1px solid rgba(120,180,200,0.14);background:rgba(120,180,200,0.03);position:relative;}
.ma-project-tag{position:absolute;top:-1px;left:2rem;font-size:6.5px;font-weight:600;letter-spacing:.45em;color:rgba(120,180,200,0.55);background:#080d10;padding:0 .7rem;text-transform:uppercase;}
.ma-project-title{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,2.8vw,2.2rem);font-weight:700;color:rgba(232,226,216,0.88);margin-bottom:.5rem;line-height:1.05;}
.ma-project-title em{font-style:italic;font-weight:400;color:rgba(120,180,200,0.5);}
.ma-project-meta{font-size:7.5px;font-weight:300;letter-spacing:.3em;color:rgba(120,180,200,0.45);text-transform:uppercase;margin-bottom:1.4rem;display:flex;flex-wrap:wrap;gap:.8rem;}
.ma-project-body{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.12rem;font-weight:300;line-height:1.9;color:rgba(232,226,216,0.82);}
.ma-project-body p+p{margin-top:.9rem;}
.ma-grid-inner{display:grid;grid-template-columns:1fr 1.4fr;gap:3rem;margin-top:2rem;align-items:start;}
@media(max-width:700px){.ma-grid-inner{grid-template-columns:1fr;gap:1.5rem;}}
.ma-photos{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.ma-photo{overflow:hidden;aspect-ratio:3/4;}
.ma-photo.wide{grid-column:span 2;aspect-ratio:16/9;}
.ma-photo-h{overflow:hidden;aspect-ratio:16/9;grid-column:span 2;} /* horizontal landscape photos */
.ma-photo img,.ma-photo-h img{width:100%;height:100%;object-fit:cover;display:block;}
.ma-photo-ph{width:100%;height:100%;min-height:140px;background:rgba(120,180,200,0.04);display:flex;align-items:center;justify-content:center;font-size:7px;letter-spacing:.3em;color:rgba(120,180,200,0.2);text-transform:uppercase;text-align:center;padding:.5rem;}
.festival-pill{display:inline-flex;align-items:center;gap:.5rem;background:rgba(120,180,200,0.07);border:1px solid rgba(120,180,200,0.2);padding:.4rem 1rem;margin:.4rem .4rem 0 0;font-size:7.5px;font-weight:400;letter-spacing:.28em;color:rgba(120,180,200,0.65);text-transform:uppercase;}
.festival-pill.gold{background:rgba(245,197,24,0.07);border-color:rgba(245,197,24,0.2);color:rgba(245,197,24,0.65);}
.ma-artists{font-size:7.5px;font-weight:300;letter-spacing:.2em;color:rgba(232,226,216,0.3);text-transform:uppercase;margin-top:1.2rem;line-height:2;}
.ma-artists strong{color:rgba(232,226,216,0.55);font-weight:400;}
/* Jena screenshot — vertical/portrait display, centred, max ~320px wide */
.jenna-screenshot{margin-top:1.5rem;border:1px solid rgba(245,197,24,0.18);overflow:hidden;max-width:320px;}
.jenna-screenshot img{width:100%;display:block;}
.jenna-screenshot-ph{padding:2rem;font-size:7.5px;letter-spacing:.3em;color:rgba(245,197,24,0.3);text-transform:uppercase;text-align:center;background:rgba(245,197,24,0.03);}
.soundscape-box{background:rgba(120,180,200,0.03);border:1px solid rgba(120,180,200,0.1);border-left:2px solid rgba(120,180,200,0.3);padding:2rem;margin-top:2rem;}
.soundscape-label{font-size:7px;font-weight:400;letter-spacing:.4em;color:rgba(120,180,200,0.5);text-transform:uppercase;margin-bottom:.8rem;}
.soundscape-note{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;font-weight:300;line-height:1.8;color:rgba(232,226,216,0.68);}

/* ── WRITER ── */
#writer{background:linear-gradient(to bottom,#0e0c0a,#2b2419 14%,#2b2419 86%,#0e0c0a);padding:5rem 2.5rem;}
.poetry-label{font-size:8px;font-weight:400;letter-spacing:.45em;color:rgba(200,170,95,0.7);text-transform:uppercase;margin-bottom:.9rem;}
.poetry-box{background:rgba(232,226,216,0.03);border:1px solid rgba(232,226,216,0.09);border-left:2px solid rgba(200,170,95,0.4);padding:2rem;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.12rem;font-weight:300;line-height:1.95;color:rgba(232,226,216,0.88);white-space:pre-line;}

/* ── ACTOR ── */
#actor{background:linear-gradient(to bottom,#0e0c0a,#111010);padding:5rem 2.5rem;}
.actor-projects{list-style:none;}
.ap{padding:.85rem 0;border-bottom:1px solid rgba(232,226,216,0.05);display:grid;grid-template-columns:1.3rem 1fr;gap:.7rem;}
.ap-dot{width:3px;height:3px;border-radius:50%;background:rgba(232,226,216,0.18);margin-top:.5rem;}
.ap-title{font-family:'Playfair Display',serif;font-size:.88rem;color:rgba(232,226,216,0.68);display:block;margin-bottom:.15rem;}
.ap-meta{font-size:7px;font-weight:300;letter-spacing:.2em;color:rgba(232,226,216,0.28);text-transform:uppercase;}

/* ── HIRE ── */
#hire{position:relative;overflow:hidden;background:linear-gradient(to bottom,#0e0c0a,#130e0d);padding:8rem 2.5rem 6rem;text-align:center;border-top:1px solid rgba(232,226,216,0.05);}
.hire-ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Playfair Display',serif;font-weight:900;font-style:italic;font-size:clamp(6rem,18vw,24rem);color:rgba(232,226,216,0.025);white-space:nowrap;pointer-events:none;line-height:1;}
.hire-ey{font-size:8px;font-weight:400;letter-spacing:.45em;color:rgba(232,226,216,0.28);text-transform:uppercase;margin-bottom:1.8rem;display:flex;align-items:center;justify-content:center;gap:1rem;}
.hire-ey::before,.hire-ey::after{content:'';width:22px;height:1px;background:rgba(232,226,216,0.18);}
.hire-h{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(2.5rem,5.5vw,6rem);font-weight:400;line-height:1;color:#e8e2d8;margin-bottom:1.4rem;}
.hire-sub{font-size:.85rem;font-weight:300;line-height:1.9;color:rgba(232,226,216,0.5);max-width:440px;margin:0 auto 3rem;}
.contact-stack{display:flex;flex-direction:column;align-items:center;gap:.9rem;margin-bottom:2.5rem;}
.contact-btn{display:inline-flex;align-items:center;gap:.9rem;min-width:280px;justify-content:center;font-size:8.5px;font-weight:400;letter-spacing:.35em;color:#e8e2d8;text-decoration:none;text-transform:uppercase;border:1px solid rgba(232,226,216,0.18);padding:1rem 2.5rem;position:relative;overflow:hidden;transition:border-color .4s;}
.contact-btn::before{content:'';position:absolute;inset:0;background:rgba(232,226,216,0.06);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.23,1,.32,1);}
.contact-btn:hover::before{transform:scaleX(1);}
.contact-btn:hover{border-color:rgba(232,226,216,0.4);}
.imdb-hire{display:inline-flex;align-items:center;gap:.8rem;background:rgba(245,197,24,0.07);border:1px solid rgba(245,197,24,0.28);padding:.8rem 2rem;text-decoration:none;transition:background .3s;margin-top:1rem;}
.imdb-hire:hover{background:rgba(245,197,24,0.13);}
.imdb-hire .ilogo{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:rgba(245,197,24,0.9);}
.imdb-hire .itext{font-size:7.5px;font-weight:400;letter-spacing:.3em;color:rgba(245,197,24,0.5);text-transform:uppercase;}

/* ── MARQUEE ── */
.mq-wrap{overflow:hidden;white-space:nowrap;border-top:1px solid rgba(232,226,216,0.05);border-bottom:1px solid rgba(232,226,216,0.05);padding:.8rem 0;background:rgba(14,12,10,0.8);}
.mq-track{display:inline-block;animation:mqroll 32s linear infinite;}
.mq-track span{font-size:7.5px;font-weight:300;letter-spacing:.4em;color:rgba(232,226,216,0.22);text-transform:uppercase;padding:0 1.8rem;}
.mq-track .rs{color:rgba(180,50,35,0.55);padding:0 .3rem;letter-spacing:0;}
@keyframes mqroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ── FOOTER ── */
footer{background:#0a0907;padding:2.2rem 2.5rem;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-top:1px solid rgba(232,226,216,0.05);}
@media(max-width:700px){footer{grid-template-columns:1fr;gap:1rem;text-align:center;}}
.fc{font-size:.68rem;font-weight:300;color:rgba(232,226,216,0.2);letter-spacing:.04em;line-height:1.8;}
.fc a{color:rgba(232,226,216,0.2);text-decoration:none;transition:color .3s;}
.fc a:hover{color:rgba(232,226,216,0.5);}
.fm{font-family:'Playfair Display',serif;font-size:10px;letter-spacing:.45em;color:rgba(232,226,216,0.18);text-transform:uppercase;text-align:center;}
.fs{display:flex;justify-content:flex-end;gap:1.6rem;}
@media(max-width:700px){.fs{justify-content:center;}}
.fs a{font-size:.68rem;font-weight:300;letter-spacing:.2em;color:rgba(232,226,216,0.2);text-decoration:none;text-transform:uppercase;transition:color .3s;}
.fs a:hover{color:rgba(232,226,216,0.55);}

/* ── SCROLL REVEAL ── */
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.23,1,.32,1),transform .8s cubic-bezier(.23,1,.32,1);}
.rv.d1{transition-delay:.1s}.rv.d2{transition-delay:.2s}.rv.d3{transition-delay:.3s}
.rv.in{opacity:1;transform:translateY(0);}
</style>
